import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.api.Action
import org.gradle.api.tasks.Internal

buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath("org.yaml:snakeyaml:2.7")
	}
}
//project.afterEvaluate { project.tasks.all { Task t -> t.inputs.file "build.gradle"; } }

def jobs = tasks.register("jobs", Exec.class) {
	group = "Pre-build"
	description = "Processes the jobs collection by removing unused stuff from their frontmatter for privacy"

	def script = "sources/jobs/strip-frontmatter.rb"
	def from = "sources/jobs/"
	def to = "_jobs/"
	inputs.file(script)
	inputs.dir(from)
	outputs.dir(to)
	logging.captureStandardOutput(LogLevel.INFO)
	commandLine("ruby", script, from, to)
}
def font = tasks.register("font", Exec.class) {
	group = "Pre-build"
	description = "Regenerate the custom icon font"

	workingDir = file("sources/iconfont")
	inputs.file(new File(workingDir, "fontcustom.yml"))
	inputs.dir(new File(workingDir, "vectors"))
	outputs.file("assets/fonts/iconfont.ttf")
	outputs.file("assets/fonts/iconfont.svg")
	outputs.file("assets/fonts/iconfont.woff")
	outputs.file("assets/fonts/iconfont.eot")
	outputs.file("_sass/_iconfont.scss")
	outputs.file("sources/iconfont/iconfont-preview.html")
	logging.captureStandardOutput(LogLevel.INFO)
	commandLine(Os.isFamily(Os.FAMILY_WINDOWS) ? "fontcustom.bat" : "fontcustom", "compile")
}

def style = "styles_feeling_responsive"
def slow = file("assets/css/${style}.scss")
def ignored = file("assets/css/_${style}.scss")
def fast = "assets/css/${style}.css"
def fastSource = file("_site/" + fast)
def fastStyleCopyCachedCSS = tasks.register("fastStyleCopyCachedCSS", Copy.class) {

	from(fastSource)
	into("assets/css")
	onlyIf {
		if (!fastSource.exists()) {
			logger.warn("There's no rendered CSS file: ${fastSource}")
			return false
		}
		return true
	}
}
def fastStyle = tasks.register("fastStyle") {
	group = "Efficiency"
	description = "Uses generated CSS from _site instead of compiling from _sass."
	dependsOn(fastStyleCopyCachedCSS)

	onlyIf { fastStyleCopyCachedCSS.get().state.didWork || fastStyleCopyCachedCSS.get().state.skipMessage == "UP-TO-DATE" }
	doLast {
		if (slow.exists() && ignored.exists() && slow.text == ignored.text) { ignored.delete() }
		if (!slow.renameTo(ignored)) { throw new IOException("Cannot rename ${slow} to ${ignored}.") }
	}
	outputs.upToDateWhen { !slow.exists() && ignored.exists() }
}
def slowStyleRemoveCachedCSS = tasks.register("slowStyleRemoveCachedCSS", Delete.class) {
	delete(fast)
	onlyIf { slow.exists() || ignored.exists() }
}
def slowStyle = tasks.register("slowStyle") {
	group = "Efficiency"
	description = "Generates CSS from _sass."
	dependsOn(slowStyleRemoveCachedCSS)

	doLast {
		if (!ignored.renameTo(slow)) {
			throw new IOException("Cannot rename ${ignored} to ${slow}.")
		}
	}
	outputs.upToDateWhen { !ignored.exists() && slow.exists() }
}

project.afterEvaluate {
	tasks.named("build", Jekyll.class).configure {
		mustRunAfter(jobs, font, fastStyle, slowStyle, tasks.withType(JekyllSetup.class))
	}
	tasks.named("serve", Jekyll.class).configure {
		mustRunAfter(jobs, font, fastStyle, slowStyle, tasks.withType(JekyllSetup.class))
	}
	tasks.named("clean", Delete.class).configure { mustRunAfter(fastStyleCopyCachedCSS) }

	tasks.register("fastDev") {
		group = "Efficiency"
		description = "Daily development task to run in browser for editing content."
		dependsOn(tasks.named("fastStyle"), tasks.named("serve"), tasks.named("dev"), tasks.named("skip"))
	}
	tasks.register("fastDevStyle") {
		group = "Efficiency"
		description = "Daily development task to run in browser for editing theme."
		dependsOn(tasks.named("slowStyle"), tasks.named("serve"), tasks.named("dev"), tasks.named("skip"))
	}
	tasks.register("preCommit") {
		group = "Efficiency"
		description = "Task to run before commiting to version control."
		dependsOn(tasks.named("slowStyle"), tasks.named("clean"), tasks.named("jobs"), tasks.named("build"))
	}
	tasks.register("preCommitServe") {
		group = "Efficiency"
		description = "Task to run before commiting to version control."
		dependsOn(tasks.named("slowStyle"), tasks.named("clean"), tasks.named("jobs"), tasks.named("serve"), tasks.named("local"))
	}
	tasks.register("rebuild") {
		group = "Efficiency"
		description = "Rebuild the whole site from scratch."
		dependsOn(tasks.named("slowStyle"), tasks.named("clean"), tasks.named("jobs"), tasks.named("font"), tasks.named("build"), tasks.named("local"))
	}
}

def clean = tasks.register("clean", Delete.class) {
	group = Jekyll.GROUP
	description = "Remove files generated by jekyll build"
	delete(".sass-cache", "_site")
}
def build = tasks.register("build", Jekyll.class) {
	description = "Runs jekyll build, use tasks in ${JekyllSetup.GROUP} group to change behavior"
	jekyllTask = "build"
	mustRunAfter(clean)
}
def serve = tasks.register("serve", Jekyll.class) {
	description = "Start jekyll in serve mode, use tasks in ${JekyllSetup.GROUP} group to change behavior"
	jekyllTask = "serve"
	mustRunAfter(clean)
	outputs.upToDateWhen { false }
}

def local = tasks.register("local", JekyllSetup.class) {
	description = "Use _config_local.yml overrides"
	action = {
		it.config("_config_local.yml")
	}
}
def dev = tasks.register("dev", JekyllSetup.class) {
	description = "Use _config_dev.yml overrides and sets JEKYLL_ENV to development"
	dependsOn(local)
	action = {
		it.config("_config_dev.yml")
		it.environment("JEKYLL_ENV", "development")
	}
}
def noskip = tasks.register("noskip", JekyllSetup.class) {
	description = "Remove --skip-initial-build from serve command (default is removed)"
	action = { it.skip = false }
}
def skip = tasks.register("skip", JekyllSetup.class) {
	description = "Add --skip-initial-build to serve command (default is removed)"
	action = { it.skip = true }
}
noskip.configure { mustRunAfter(skip) }
def notrace = tasks.register("notrace", JekyllSetup.class) {
	description = "Remove --trace argument from jekyll (default is added)"
	action = { it.trace = false }
}
def trace = tasks.register("trace", JekyllSetup.class) {
	description = "Add --trace argument to jekyll (default is added)"
	action = { it.trace = true }
}
notrace.configure { mustRunAfter(trace) }
def noverbose = tasks.register("noverbose", JekyllSetup.class) {
	description = "Remove --trace argument from jekyll (default is removed)"
	action = { it.verbose = false }
}
def verbose = tasks.register("verbose", JekyllSetup.class) {
	description = "Add --trace argument to jekyll (default is removed)"
	action = { it.verbose = true }
}
noverbose.configure { mustRunAfter(verbose) }

class JekyllSetup extends DefaultTask {
	static final GROUP = "Jekyll Param"

	@Internal
	Action<Jekyll> action

	JekyllSetup() {
		group = GROUP
	}

	@TaskAction
	void setup() {
		project.tasks.withType(Jekyll.class).all(action)
	}
}

abstract class Jekyll extends Exec {
	static final GROUP = "Jekyll"

	@Input
	boolean trace = true

	@Input
	boolean verbose = false

	@Input
	boolean skip = false

	@Input
	boolean incremental = true

	@Input
	String jekyllTask

	private final List<String> configs = ["_config.yml"]

	Jekyll() {
		group = GROUP
		def excludes = new org.yaml.snakeyaml.Yaml().load(new File(project.rootDir, "_config.yml").text).exclude
		def tree = project.fileTree(dir: project.rootDir)
		excludes.each { tree.exclude(it) }
		configs.each { tree.include(it) }
		inputs.files(tree)
		outputs.dir(new File(project.rootDir, "_site"))
		onlyIf { jekyllTask }

		if (System.env.JEKYLL_ENV?.trim()) {
			environment("JEKYLL_ENV", System.env.JEKYLL_ENV?.trim())
		} else {
			environment("JEKYLL_ENV", "production")
		}
	}

	@Override protected void exec() {
		workingDir = project.file(unsubst(workingDir.path))
		commandLine([Os.isFamily(Os.FAMILY_WINDOWS)? "bundle.bat" : "bundle",
			"exec",
			"jekyll",
			jekyllTask,
			!configs.isEmpty() ? "--config" : "",
			configs.join(","),
			trace? "--trace" : "",
			verbose? "--verbose" : "",
			incremental? "--incremental" : "",
			jekyllTask == "serve" && skip? "--skip-initial-build": ""] + args)
		super.exec()
	}

	void config(String file) {
		configs.add(file)
		inputs.file(file)
	}

	private static String unsubst(String path) {
		if (!Os.isFamily(Os.FAMILY_WINDOWS)) return path
		def subst = "subst".execute()
		def substs = [:]
		subst.text.eachLine {
			substs[it[0..1]] = it.substring("X:\\: => ".size(), it.size())
		}
		if (subst.exitValue()) return path
		while(path[0..1] in substs) {
			path = substs[path[0..1]] + path.substring(2)
		}
		return path
	}
}
