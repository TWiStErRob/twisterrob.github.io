import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.api.tasks.options.Option

buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath("org.yaml:snakeyaml:2.7")
	}
}

def jobs = tasks.register("jobs", Exec.class) {
	group = "Pre-build"
	description = "Processes the jobs collection by removing unused stuff from their frontmatter for privacy"

	def script = "sources/jobs/strip-frontmatter.rb"
	def from = "sources/jobs/"
	def to = "_jobs/"
	inputs.file(script)
	inputs.dir(from)
	outputs.dir(to)
	logging.captureStandardOutput(LogLevel.INFO)
	commandLine("ruby", script, from, to)
}
def font = tasks.register("font", Exec.class) {
	group = "Pre-build"
	description = "Regenerate the custom icon font"

	workingDir = file("sources/iconfont")
	inputs.file(new File(workingDir, "fontcustom.yml"))
	inputs.dir(new File(workingDir, "vectors"))
	outputs.file("assets/fonts/iconfont.ttf")
	outputs.file("assets/fonts/iconfont.svg")
	outputs.file("assets/fonts/iconfont.woff")
	outputs.file("assets/fonts/iconfont.woff2")
	outputs.file("assets/fonts/iconfont.eot")
	outputs.file("_sass/_iconfont.scss")
	outputs.file("sources/iconfont/iconfont-preview.html")
	logging.captureStandardOutput(LogLevel.INFO)
	commandLine(Os.isFamily(Os.FAMILY_WINDOWS) ? "fontcustom.bat" : "fontcustom", "compile")
}

def style = "styles_feeling_responsive"
def slow = file("assets/css/${style}.scss")
def ignored = file("assets/css/_${style}.scss")
def fast = "assets/css/${style}.css"
def fastSource = file("_site/" + fast)
def fastStyleCopyCachedCSS = tasks.register("fastStyleCopyCachedCSS", Copy.class) {

	from(fastSource)
	into("assets/css")
	onlyIf {
		if (!fastSource.exists()) {
			logger.warn("There's no rendered CSS file: ${fastSource}")
			return false
		}
		return true
	}
}
def fastStyle = tasks.register("fastStyle") {
	group = "Efficiency"
	description = "Uses generated CSS from _site instead of compiling from _sass."
	dependsOn(fastStyleCopyCachedCSS)

	onlyIf { fastStyleCopyCachedCSS.get().state.didWork || fastStyleCopyCachedCSS.get().state.skipMessage == "UP-TO-DATE" }
	doLast {
		if (slow.exists() && ignored.exists() && slow.text == ignored.text) { ignored.delete() }
		if (!slow.renameTo(ignored)) { throw new IOException("Cannot rename ${slow} to ${ignored}.") }
	}
	outputs.upToDateWhen { !slow.exists() && ignored.exists() }
}
def slowStyleRemoveCachedCSS = tasks.register("slowStyleRemoveCachedCSS", Delete.class) {
	delete(fast)
	onlyIf { slow.exists() || ignored.exists() }
}
def slowStyle = tasks.register("slowStyle") {
	group = "Efficiency"
	description = "Generates CSS from _sass."
	dependsOn(slowStyleRemoveCachedCSS)

	doLast {
		if (!ignored.renameTo(slow)) {
			throw new IOException("Cannot rename ${ignored} to ${slow}.")
		}
	}
	outputs.upToDateWhen { !ignored.exists() && slow.exists() }
}

def clean = tasks.register("clean", Delete.class) {
	group = Jekyll.GROUP
	description = "Remove files generated by jekyll build"
	delete(".sass-cache", "_site")
}

def build = tasks.register("build", Jekyll.class) {
	description = "Runs Jekyll build with command-line options to change behavior"
	jekyllTask = "build"
	mustRunAfter(clean)
}
def serve = tasks.register("serve", Jekyll.class) {
	description = "Starts Jekyll serve with command-line options to change behavior"
	jekyllTask = "serve"
	mustRunAfter(clean)
	outputs.upToDateWhen { false }
}

abstract class Jekyll extends Exec {
	static final GROUP = "Jekyll"

	@Input
	boolean trace = true

	@Input
	boolean verbose = false

	@Input
	boolean skip = false

	@Input
	boolean incremental = true

	@Input
	String jekyllTask

	private final List<String> configs = ["_config.yml"]

	@Option(option = "trace", description = "Show Jekyll stack traces")
	void setTrace(boolean enabled) { trace = enabled }

	@Option(option = "notrace", description = "Hide Jekyll stack traces")
	void setNotrace(boolean enabled) { trace = !enabled }

	@Option(option = "verbose", description = "Show verbose Jekyll output")
	void setVerbose(boolean enabled) { verbose = enabled }

	@Option(option = "noverbose", description = "Hide verbose Jekyll output")
	void setNoverbose(boolean enabled) { verbose = !enabled }

	@Option(option = "skip", description = "Skip the initial Jekyll serve build")
	void setSkip(boolean enabled) { skip = enabled }

	@Option(option = "noskip", description = "Run the initial Jekyll serve build")
	void setNoskip(boolean enabled) { skip = !enabled }

	@Option(option = "local", description = "Include local Jekyll configuration")
	void setLocal(boolean enabled) {
		if (enabled) config("_config_local.yml")
	}

	@Option(option = "dev", description = "Include development Jekyll configuration")
	void setDev(boolean enabled) {
		if (enabled) {
			setLocal(true)
			config("_config_dev.yml")
			environment("JEKYLL_ENV", "development")
		}
	}

	Jekyll() {
		group = GROUP
		def excludes = new org.yaml.snakeyaml.Yaml().load(new File(project.rootDir, "_config.yml").text).exclude
		def tree = project.fileTree(dir: project.rootDir)
		excludes.each { tree.exclude(it) }
		configs.each { tree.include(it) }
		inputs.files(tree)
		outputs.dir(new File(project.rootDir, "_site"))
		onlyIf { jekyllTask }

		if (System.env.JEKYLL_ENV?.trim()) {
			environment("JEKYLL_ENV", System.env.JEKYLL_ENV?.trim())
		} else {
			environment("JEKYLL_ENV", "production")
		}
	}

	@Override protected void exec() {
		workingDir = unsubst(workingDir)
		commandLine([Os.isFamily(Os.FAMILY_WINDOWS)? "bundle.bat" : "bundle",
			"exec",
			"jekyll",
			jekyllTask,
			!configs.isEmpty() ? "--config" : "",
			configs.join(","),
			trace? "--trace" : "",
			verbose? "--verbose" : "",
			incremental? "--incremental" : "",
			jekyllTask == "serve" && skip? "--skip-initial-build": ""] + args)
		super.exec()
	}

	void config(String file) {
		if (!configs.contains(file)) {
			configs.add(file)
			inputs.file(file)
		}
	}

	private static File unsubst(File directory) {
		if (!Os.isFamily(Os.FAMILY_WINDOWS)) return directory
		def subst = "subst".execute()
		def substs = [:]
		subst.text.eachLine {
			substs[it[0..1]] = it.substring("X:\\: => ".size(), it.size())
		}
		if (subst.exitValue()) return directory
		String path = directory.path
		while(path[0..1] in substs) {
			path = substs[path[0..1]] + path.substring(2)
		}
		return new File(path)
	}
}

build.configure {
	mustRunAfter(jobs, font, fastStyle, slowStyle)
}
serve.configure {
	mustRunAfter(jobs, font, fastStyle, slowStyle)
}
clean.configure {
	mustRunAfter(fastStyleCopyCachedCSS)
}

tasks.register("fastDev", Jekyll.class) {
	group = "Efficiency"
	description = "Daily development task to run in browser for editing content."
	jekyllTask = "serve"
	setDev(true)
	setSkip(true)
	dependsOn(fastStyle)
	outputs.upToDateWhen { false }
}
tasks.register("fastDevStyle", Jekyll.class) {
	group = "Efficiency"
	description = "Daily development task to run in browser for editing theme."
	jekyllTask = "serve"
	setDev(true)
	setSkip(true)
	dependsOn(slowStyle)
	outputs.upToDateWhen { false }
}
tasks.register("preCommit") {
	group = "Efficiency"
	description = "Task to run before committing to version control."
	dependsOn(slowStyle, clean, jobs, build)
}
tasks.register("preCommitServe", Jekyll.class) {
	group = "Efficiency"
	description = "Task to run before committing to version control."
	jekyllTask = "serve"
	setLocal(true)
	dependsOn(slowStyle, clean, jobs)
	outputs.upToDateWhen { false }
}
tasks.register("rebuild", Jekyll.class) {
	group = "Efficiency"
	description = "Rebuild the whole site from scratch."
	jekyllTask = "build"
	setLocal(true)
	dependsOn(slowStyle, clean, jobs, font)
}
